<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Ricky Kashyap</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
(function(){
  try{
    var t=localStorage.getItem('theme');
    if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9;--surface:#ffffff;--text:#18181b;--text-2:#52525b;--text-3:#71717a;
  --border:#e7e5e4;--border-2:#d6d3d1;--accent:#ea580c;
  --dot:rgb(24 24 27 / .09);--glow:rgb(234 88 12 / .10);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0a0b;--surface:#121214;--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#8a8a94;
  --border:#232327;--border-2:#34343a;--accent:#ff7a3d;
  --dot:rgb(255 255 255 / .07);--glow:rgb(255 122 61 / .13);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0a0a0b;--surface:#121214;--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#8a8a94;
    --border:#232327;--border-2:#34343a;--accent:#ff7a3d;
    --dot:rgb(255 255 255 / .07);--glow:rgb(255 122 61 / .13);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;
  background:var(--bg);color:var(--text);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-align:center;position:relative;overflow-x:clip;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 60% 55% at 50% 40%,#000 20%,transparent 75%);
}
body::after{
  content:"";position:fixed;left:50%;top:-30%;width:900px;height:640px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,var(--glow),transparent);
}
main{position:relative;z-index:1;max-width:560px}
.code{font-family:'Geist Mono',ui-monospace,monospace;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
h1{margin:16px 0 0;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.04em;font-weight:600}
h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent);font-size:1.06em}
p.lede{margin:18px auto 0;max-width:420px;color:var(--text-2);font-size:1.05rem;line-height:1.65}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
a.btn{
  display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:999px;
  font-weight:500;text-decoration:none;transition:transform .25s cubic-bezier(.16,1,.3,1);
}
a.btn:hover{transform:translateY(-1px)}
.primary{background:var(--text);color:var(--bg)}
.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>This page <em>doesn't exist</em>.</h1>
  <p class="lede">The link may be old or mistyped. Everything on this site lives on one page, so the homepage is the best place to start.</p>
  <div class="actions">
    <a class="btn primary" href="/">Back to the homepage</a>
    <a class="btn ghost" href="/#projects">See projects</a>
  </div>
</main>
</body>
</html>
